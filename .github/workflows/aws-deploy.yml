name: Build and Deploy to AWS EC2 without Docker

on:
  push:
    branches: ["aws-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/

      - name: Package server app
        run: |
          cd ${{ env.SERVER_DIR }}
          tar czf ../matapp.tar.gz .

      - name: Upload server package to EC2
        uses: appleboy/scp-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_NO_DOCKER }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: matapp.tar.gz

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_NO_DOCKER }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 900s
          script: |
            # Ensure deployment folder exists
            mkdir -p matapp

            # Extract new code inside matapp folder
            tar xzf matapp.tar.gz -C matapp
            rm matapp.tar.gz

            cd matapp

            # Create venv if not exists
            python3 -m venv venv

            source venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            # Pre-download SentenceTransformer model
            python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

            # Stop existing Gunicorn if running
            if [ -f gunicorn.pid ]; then
              kill $(cat gunicorn.pid) || true
              rm gunicorn.pid
            fi

            # Start Gunicorn in background on port 8000
            nohup venv/bin/gunicorn --bind 0.0.0.0:8000 app:app --pid gunicorn.pid --daemon

            echo "✅ Deployment complete. App running on port 8000."
