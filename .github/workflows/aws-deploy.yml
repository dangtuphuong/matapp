name: Build and Deploy to AWS EC2 without Docker

on:
  push:
    branches: ["aws-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_DEPLOY_DIR: ./server_deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server deploy directory
        run: |
          rm -rf ${{ env.SERVER_DEPLOY_DIR }}
          mkdir -p ${{ env.SERVER_DEPLOY_DIR }}

          # Copy server code
          cp -a ${{ env.SERVER_DIR }}/* ${{ env.SERVER_DEPLOY_DIR }}/

          # Copy client build to server deploy dir
          mkdir -p ${{ env.SERVER_DEPLOY_DIR }}/build
          cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_DEPLOY_DIR }}/build/

          # Optional: check result
          ls -la ${{ env.SERVER_DEPLOY_DIR }}

      - name: Upload server files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_NO_DOCKER }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: ${{ env.SERVER_DEPLOY_DIR }}/*
          target: /home/${{ secrets.EC2_SSH_USER }}/app

      - name: Deploy app on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_NO_DOCKER }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          script: |
            # Navigate to app directory
            cd /home/${{ secrets.EC2_SSH_USER }}/app

            # Setup Python venv if needed
            python3 -m venv venv
            source venv/bin/activate

            # Install requirements
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gunicorn

            # Pre-download the model (optional, if not cached)
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

            # Stop existing Gunicorn process if running
            if [ -f gunicorn.pid ]; then
              kill $(cat gunicorn.pid) || true
              rm gunicorn.pid
            fi

            # Start Gunicorn in background
            nohup venv/bin/gunicorn --bind 0.0.0.0:8000 app:app --pid gunicorn.pid --daemon

            echo "✅ Deployment complete. App running on port 8000."
