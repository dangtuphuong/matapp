name: Build and Deploy to AWS EC2 (No Docker)

on:
  push:
    branches: ["aws-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build
  APP_DIR: /home/${{ secrets.EC2_SSH_USER }}/app
  VENV_DIR: /home/${{ secrets.EC2_SSH_USER }}/app/venv

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/

      - name: Archive server build for upload
        run: |
          cd ${{ env.SERVER_DIR }}
          tar czf ../server-build.tar.gz .

      - name: Upload server build to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: |
            ./server-build.tar.gz
          target: ${{ env.APP_DIR }}

      - name: Upload .env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if [ -n "${{ secrets.EC2_APP_ENV }}" ]; then
              echo "${{ secrets.EC2_APP_ENV }}" > ${{ env.APP_DIR }}/.env
              chmod 600 ${{ env.APP_DIR }}/.env
              echo ".env uploaded"
            else
              echo "No EC2_APP_ENV secret defined — skipping .env upload"
            fi

      - name: Install dependencies and restart Gunicorn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ env.APP_DIR }}

            # Extract new code
            tar xzf server-build.tar.gz
            rm server-build.tar.gz

            # Create venv if not exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            # Upgrade pip & install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # Stop existing Gunicorn
            if [ -f gunicorn.pid ]; then
              kill $(cat gunicorn.pid) || true
              rm gunicorn.pid
            fi

            # Start Gunicorn in background on port 8000
            nohup venv/bin/gunicorn --bind 0.0.0.0:8000 app:app --pid gunicorn.pid --daemon

            echo "✅ Deployment complete. App running on port 8000."
