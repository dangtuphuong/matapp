name: Build and Deploy to EC2 with GHCR Private

on:
  push:
    branches: ["aws-production"]
  workflow_dispatch:

# ----------------------------------------------------
# Secrets and Environment Variables
# ----------------------------------------------------

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build
  # GitHub Container Registry image path
  GHCR_IMAGE: ghcr.io/${{ secrets.GHCR_USERNAME }}/your-app-name

# ----------------------------------------------------
# Required Secrets (set in GitHub repo settings):
#
# EC2_HOST           → EC2 Public IP or DNS
# EC2_USERNAME       → SSH username (ec2-user, ubuntu, etc.)
# EC2_SSH_KEY        → Private SSH key (.pem content, base64 encoded or raw)
# GHCR_USERNAME      → Your GitHub username (same as profile name)
# GHCR_PAT           → GitHub Personal Access Token with read/write:packages
# ----------------------------------------------------

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          if [ -d "${{ env.CLIENT_DIST_DIR }}" ] && [ "$(ls -A ${{ env.CLIENT_DIST_DIR }})" ]; then
            cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/
          else
            echo "Warning: Client dist directory is empty or missing. Nothing copied to ${{ env.SERVER_BUILD_TARGET_DIR }}."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Login to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            echo "Pulling latest image..."
            docker pull ${{ env.GHCR_IMAGE }}:latest

            echo "Stopping existing container (if running)..."
            docker stop my-app || true
            docker rm my-app || true

            echo "Running new container..."
            docker run -d -p 80:8000 --name my-app ${{ env.GHCR_IMAGE }}:latest

            echo "✅ Deployment complete!"
