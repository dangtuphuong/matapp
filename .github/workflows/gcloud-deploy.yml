name: Build and Deploy to Google Cloud Run

on:
  push:
    branches: ["production-gcloud"]
  workflow_dispatch:

env:
  # Google Cloud Configuration
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  CLOUD_RUN_SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}

  # Application Configuration
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build

  # Derived: Full image path in Google Artifact Registry
  # Format: <location>-docker.pkg.dev/<project-id>/<repository-name>/<image-name>
  GAR_IMAGE_PATH: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCLOUD_IMAGE_NAME }}/${{ secrets.GCLOUD_IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          if [ -d "${{ env.CLIENT_DIST_DIR }}" ] && [ "$(ls -A ${{ env.CLIENT_DIST_DIR }})" ]; then
            cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/
          else
            echo "Warning: Client dist directory is empty or missing. Nothing copied to ${{ env.SERVER_BUILD_TARGET_DIR }}."
          fi

      # --- Google Cloud Authentication ---
      - name: Authenticate to Google Cloud (Service Account Key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GAR
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH }}:${{ github.sha }}
            ${{ env.GAR_IMAGE_PATH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud Run
        id: deploy
        run: |
          set -eo pipefail
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GAR_IMAGE_PATH }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --quiet
          echo "✅ Deployment to Cloud Run successful. Service is updating."

      - name: Get Cloud Run Service URL
        if: success()
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_NAME }} --platform managed --region ${{ env.CLOUD_RUN_REGION }} --format 'value(status.url)')
          LATEST_REVISION=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_NAME }} --platform managed --region ${{ env.CLOUD_RUN_REGION }} --format 'value(status.latestReadyRevisionName)')
          echo "Cloud Run Service URL: $SERVICE_URL"
          echo "Latest Ready Revision: $LATEST_REVISION"

      - name: Roll back Cloud Run service on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          set -eo pipefail
          echo "Deployment failed. Attempting to roll back to the last known good revision..."

          REVISIONS_INFO=$(gcloud run revisions list \
            --service=${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --platform=managed \
            --sort-by="~metadata.creationTimestamp" \
            --format="json")

          # Find a "Ready" revision whose image is NOT the one we just attempted to deploy.
          PREVIOUS_GOOD_REVISION=$(echo "$REVISIONS_INFO" | jq -r \
            --arg attempted_image_with_sha "${{ env.GAR_IMAGE_PATH }}:${{ github.sha }}" \
            '.[] | select(.spec.containers[0].image != $attempted_image_with_sha) | select(.status.conditions[] | select(.type == "Ready" and .status == "True")) | .metadata.name' | head -n 1)

          if [ -n "$PREVIOUS_GOOD_REVISION" ]; then
            echo "Found previous good revision: $PREVIOUS_GOOD_REVISION. Rolling back traffic..."
            gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
              --to-revisions=${PREVIOUS_GOOD_REVISION}=100 \
              --region=${{ env.CLOUD_RUN_REGION }} \
              --platform=managed \
              --quiet
            echo "✅ Traffic rolled back to revision $PREVIOUS_GOOD_REVISION."
            exit 0
          else
            echo "⚠️ Could not automatically determine a previous good revision for rollback. Manual intervention may be required."
            exit 1
          fi
