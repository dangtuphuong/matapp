name: Build and Deploy to Google Cloud Run

on:
  push:
    branches: ["production"]
  workflow_dispatch:

env:
  # Google Cloud Configuration
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  CLOUD_RUN_SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}

  # Application Configuration
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build

  # Derived: Full image path in Google Artifact Registry
  # Format: <location>-docker.pkg.dev/<project-id>/<repository-name>/<image-name>
  GAR_IMAGE_PATH: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCLOUD_IMAGE_NAME }}/${{ secrets.GCLOUD_IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          if [ -d "${{ env.CLIENT_DIST_DIR }}" ] && [ "$(ls -A ${{ env.CLIENT_DIST_DIR }})" ]; then
            cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/
          else
            echo "Warning: Client dist directory is empty or missing. Nothing copied to ${{ env.SERVER_BUILD_TARGET_DIR }}."
          fi

      # --- Google Cloud Authentication ---
      - name: Authenticate to Google Cloud (Service Account Key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GAR
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_IMAGE_PATH }}:${{ github.sha }}
            ${{ env.GAR_IMAGE_PATH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud Run
        id: deploy
        run: |
          set -eo pipefail
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GAR_IMAGE_PATH }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --port 8000 \
            --quiet
          echo "✅ Deployment to Cloud Run successful. Service is updating."
