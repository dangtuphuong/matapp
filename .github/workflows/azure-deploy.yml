name: Build and Deploy to Azure Web App and Azure Container App

on:
  push:
    branches: ["production"]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}

  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}, ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}

          images: "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Set Azure Container Apps to use multiple revision mode
        run: |
          az containerapp revision set-mode \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --mode multiple

      - name: Deploy new revision (0% traffic)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars "PORT=8000"

      - name: Wait for new revision to become ready
        run: |
          echo "Waiting for healthy revision..."
          LATEST_REVISION=""
          # First get the latest revision name
          for i in {1..10}; do
            LATEST_REVISION=$(az containerapp revision list \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --query "[?properties.active==\`true\`].name | [0]" -o tsv)
            if [ -n "$LATEST_REVISION" ]; then
              echo "Latest active revision: $LATEST_REVISION"
              break
            fi
            sleep 5
          done

          # Then check if it's healthy
          for i in {1..30}; do
            STATUS=$(az containerapp revision show \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --revision $LATEST_REVISION \
              --query "properties.healthState" -o tsv)
            echo "Revision health status: $STATUS"
            if [ "$STATUS" == "Healthy" ]; then
              echo "✅ Revision is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Revision failed to become healthy in time"


          exit 1

      - name: Set revision mode to single
        run: |
          az containerapp revision set-mode \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --mode single

      - name: Fail workflow if revision is unhealthy
        if: env.REVISION_HEALTHY == 'false'
        run: |
          echo "❌ Deployment failed: new revision is unhealthy"
          exit 1

      - name: Azure logout
        if: always()
        run: |
          az logout
          az cache purge
          az account clear
