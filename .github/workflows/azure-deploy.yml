name: Build and Deploy to Azure Web App

on:
  push:
    branches: ["client-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build

  # Centralized secrets for easier management
  AZURE_CREDENTIALS: ${{ secrets.CLIENT_AZURE_CREDENTIALS }}
  ACR_LOGIN_SERVER: ${{ secrets.CLIENT_ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.CLIENT_ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.CLIENT_ACR_PASSWORD }}
  IMAGE_NAME: ${{ secrets.CLIENT_AZURE_IMAGE_NAME }}
  WEB_APP_NAME: ${{ secrets.CLIENT_AZURE_WEB_APP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}, ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          images: "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Azure logout
        if: always()
        run: |
          az logout
          az cache purge
          az account clear
