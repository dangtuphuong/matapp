name: Build and Deploy to DigitalOcean with GHCR

on:
  push:
    branches: ["do-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build
  IMAGE_NAME: ghcr.io/dangtuphuong/matapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          if [ -d "${{ env.CLIENT_DIST_DIR }}" ] && [ "$(ls -A ${{ env.CLIENT_DIST_DIR }})" ]; then
            cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/
          else
            echo "Warning: Client dist directory is empty or missing. Nothing copied to ${{ env.SERVER_BUILD_TARGET_DIR }}."
          fi

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop matapp || true
            docker rm matapp || true
            docker run -d --env-file /root/app/.env --name matapp -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
            docker system prune -f
            echo "✅ Deployment to DigitalOcean complete."
