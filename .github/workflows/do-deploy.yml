name: Build and Deploy to DigitalOcean with GHCR

on:
  push:
    branches: ["do-production"]
  workflow_dispatch:

env:
  CLIENT_DIR: ./client
  SERVER_DIR: ./server
  CLIENT_DIST_DIR: ./client/dist
  SERVER_BUILD_TARGET_DIR: ./server/build
  IMAGE_NAME: ghcr.io/dangtuphuong/matapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.CLIENT_DIR }}/package-lock.json"

      - name: Install client dependencies and build
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare server build directory (copy client build)
        run: |
          mkdir -p ${{ env.SERVER_BUILD_TARGET_DIR }}
          if [ -d "${{ env.CLIENT_DIST_DIR }}" ] && [ "$(ls -A ${{ env.CLIENT_DIST_DIR }})" ]; then
            cp -a ${{ env.CLIENT_DIST_DIR }}/. ${{ env.SERVER_BUILD_TARGET_DIR }}/
          else
            echo "Warning: Client dist directory is empty or missing. Nothing copied to ${{ env.SERVER_BUILD_TARGET_DIR }}."
          fi

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          file: ${{ env.SERVER_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          script: |
            # Login to GHCR inside droplet
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Create Docker network if it doesn't exist
            docker network create matapp-network || true

            # Stop and remove existing containers if they exist
            docker stop matapp redis || true
            docker rm matapp redis || true

            # Create Redis data directory if it doesn't exist
            mkdir -p /root/redis-data

            # Start Redis container with resource constraints
            docker run -d \
              --name redis \
              --network matapp-network \
              --memory=256m \
              --memory-swap=256m \
              -p 127.0.0.1:6379:6379 \
              -v /root/redis-data:/data \
              redis:latest redis-server \
                --maxmemory 200mb \
                --maxmemory-policy allkeys-lru \
                --appendonly yes

            # Run new application container with env file
            docker run -d \
              --env-file /root/app/.env \
              --name matapp \
              --network matapp-network \
              -p 8000:8000 \
              ${{ env.IMAGE_NAME }}:latest

            # Cleanup dangling and unused images to free space
            docker system prune -f
            docker image prune -af

            echo "✅ Deployment to DigitalOcean complete."
